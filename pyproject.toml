[project]
name = "ofc-2026-snn-mzi-router"
version = "0.1.0"
description = "DAQ and photodetector sweep tooling for the OFC 2026 SNN MZI router"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "mcculw",
    # Installed from GitHub so the same spec works on the Mac and the Windows PC.
    "pydaq @ git+https://github.com/ngncs-neuromorphic/pydaq.git@main",
    "vivilux @ git+https://github.com/NeuroSumbaD/Vivilux.git@hardware_interface",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
# Vivilux points pydaq at a sibling folder (../pydaq); force the GitHub copy instead.
override-dependencies = [
    "pydaq @ git+https://github.com/ngncs-neuromorphic/pydaq.git@main",
]
